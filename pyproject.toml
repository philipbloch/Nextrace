[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nextrace"
version = "0.1.0"
description = "Trace the intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nextrace Contributors" }]
keywords = ["ai", "workflows", "llm", "tracing", "agents", "openai", "anthropic", "gemini", "nextrace"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dashboard = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
gemini = ["google-generativeai>=0.7"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openai>=1.0",
  "anthropic>=0.30",
  "google-generativeai>=0.7",
]

[project.urls]
Homepage = "https://github.com/philipbloch/Nextrace"
Repository = "https://github.com/philipbloch/Nextrace"

[project.scripts]
nextrace = "nextrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nextrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4"]
